[project]
name = "farmguard"
version = "0.1.0"
description = "Edge-AI farmland animal detection and alert system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "pytest-cov"]

[project.scripts]
farmguard = "farmguard.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

